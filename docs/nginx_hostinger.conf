# Hostinger VPS Nginx Configuration for EstateFlow Monorepo
# Location on VPS: /etc/nginx/sites-available/estateflow.conf

# -------------------------------------------------------------------
# 1. Main Web Application Marketplace (e.g. estateflow.io / www.estateflow.io)
# -------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name estateflow.io www.estateflow.io;

    # Redirect HTTP to HTTPS once SSL cert is generated by Certbot
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for heavy API routes & uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}

# -------------------------------------------------------------------
# 2. Master Admin & CMS Control Center (e.g. admin.estateflow.io)
# -------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.estateflow.io;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
